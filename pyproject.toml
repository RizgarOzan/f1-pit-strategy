[project]
name = "f1strat"
version = "0.1.0"
description = "Find the fastest pit strategy for an F1 race from OpenF1 timing data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
f1strat = "f1strat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
